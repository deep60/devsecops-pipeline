name: DevSecOps Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  sast-semgrep:
    name: SAST — Semgrep
    runs-on: ubuntu-latest        # ← fixed: GitHub's free cloud, not self-hosted
    permissions:
      contents: read

    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

    container:
      image: semgrep/semgrep

    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST scan
        run: semgrep ci



# ── PHASE 3: Secrets Detection with TruffleHog ──────────────────────
  secrets-detection:
    name: Secrets — TruffleHog
    runs-on: ubuntu-latest
    needs: sast-semgrep

    steps:
      - name: Checkout full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # must fetch ALL commits

      - name: Run TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --no-verification --json

      - name: Upload TruffleHog results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trufflehog-results
          path: trufflehog-results.json


# ── PHASE 4a: Container Scanning with Trivy ─────────────────────────
  container-scan:
    name: Container — Trivy
    runs-on: ubuntu-latest
    needs: secrets-detection

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devsecops-demo:latest ./app

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-demo:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0           # don't fail pipeline yet (Phase 6 handles this)

      - name: Save Trivy results as JSON
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-demo:latest
          format: json
          output: trivy-image-results.json

      - name: Upload Trivy results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-results
          path: trivy-image-results.json

  # ── PHASE 4b: IaC Scanning with Checkov ─────────────────────────────
  iac-scan:
    name: IaC — Checkov
    runs-on: ubuntu-latest
    needs: secrets-detection

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov Terraform scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          output_format: cli
          soft_fail: true        # don't fail pipeline yet (Phase 6 handles this)

      - name: Save Checkov results
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          output_format: json
          output_file_path: checkov-results.json
          soft_fail: true

      - name: Upload Checkov results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-results
          path: checkov-results.json


